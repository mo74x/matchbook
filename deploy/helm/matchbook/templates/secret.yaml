apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matchbook.fullname" . }}-secrets
  labels:
    {{- include "matchbook.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
