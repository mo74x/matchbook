apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchbook-app
  namespace: matchbook
  labels:
    app.kubernetes.io/name: matchbook
    app.kubernetes.io/component: matching-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matchbook-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: matchbook-app
    spec:
      containers:
        - name: app
          image: matchbook:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: matchbook-config
            - secretRef:
                name: matchbook-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
