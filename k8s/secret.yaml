apiVersion: v1
kind: Secret
metadata:
  name: matchbook-secrets
  namespace: matchbook
  labels:
    app.kubernetes.io/name: matchbook
type: Opaque
stringData:
  DATABASE_URL: "postgresql://root:password@matchbook-postgres:5432/matchbook?schema=public"
  API_KEY: "matchbook-production-api-key-secret"
  JWT_SECRET: "super-secret-jwt-key-change-in-prod"
