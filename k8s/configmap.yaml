apiVersion: v1
kind: ConfigMap
metadata:
  name: matchbook-config
  namespace: matchbook
  labels:
    app.kubernetes.io/name: matchbook
data:
  PORT: "3000"
  NODE_ENV: "production"
  USE_REDIS: "true"
  REDIS_HOST: "matchbook-redis"
  REDIS_PORT: "6379"
  LOG_SAMPLE_RATE: "1.0"
  THROTTLE_TTL: "60000"
  THROTTLE_LIMIT: "100"
