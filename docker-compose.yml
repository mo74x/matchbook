version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: matchbook_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: matchbook
    ports:
      - "5432:5432"
    volumes:
      - matchbook_pgdata:/var/lib/postgresql/data

volumes:
  matchbook_pgdata: