version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: matchbook_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: matchbook
    ports:
      - "5432:5432"
    volumes:
      - matchbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d matchbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchbook_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://root:password@postgres:5432/matchbook?schema=public"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  matchbook_pgdata: